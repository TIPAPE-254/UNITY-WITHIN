name: Deploy To Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-webapp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Log deployment status
        if: success()
        run: |
          echo "✅ Deployment to Azure successful"
          echo "App: ${{ secrets.AZURE_WEBAPP_NAME }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Set deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.payload.workflow_run?.conclusion === 'failure' ? 'failure' : 'success';
            const deploymentState = status === 'success' ? 'success' : 'failure';
            console.log(`🚀 Deployment ${deploymentState.toUpperCase()}`);
            
      - name: Send deployment notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const message = status === 'success' 
              ? '✅ Deployment to Azure completed successfully'
              : '❌ Deployment to Azure failed';
            console.log(`\n${'='.repeat(50)}`);
            console.log(message);
            console.log(`${'='.repeat(50)}\n`);
            console.log(`Branch: ${{ github.ref_name }}`);
            console.log(`Commit: ${{ github.sha }}`);
            console.log(`Actor: ${{ github.actor }}`);
            console.log(`Time: ${new Date().toISOString()}`);
